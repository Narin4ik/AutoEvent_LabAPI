name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Voting rules and controller lifecycle simulation
        run: dotnet run --project Tests/AutoEvent.Automatic.Tests.csproj -c Release

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download SCP:SL references
        id: references
        uses: Axwabo/scpsl-references-downloader@v1
      - name: Download pinned plugin dependencies
        run: |
          mkdir -p Dependencies
          curl -fsSL -o Dependencies/ProjectMER.dll https://github.com/Michal78900/ProjectMER/releases/download/2026.7.6.1/ProjectMER.dll
          curl -fsSL -o Dependencies/RadioMenuAPI.dll https://github.com/MedveMarci/RadioMenuAPI/releases/download/1.4.0/RadioMenuAPI.dll
          curl -fsSL -o Dependencies/LabApiExtensions.dll https://github.com/KadavasKingdom/LabApiExtensions/releases/download/release-v0.3.0/LabApiExtensions.dll
      - name: Build all plugins
        env:
          SL_REFERENCES: ${{ steps.references.outputs.target }}
          LABAPI_PLUGINS: ${{ github.workspace }}/Dependencies
          LABAPI_DEPENDENCIES: ${{ github.workspace }}/Dependencies
        run: dotnet build AutoEvent.sln -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: AutoEvent-LabAPI
          if-no-files-found: error
          path: |
            AutoEvent/bin/x64/Release/net48/AutoEvent.dll
            AutoEvent.AutoRun/bin/x64/Release/net48/AutoEvent.AutoRun.dll
            AutoEvent.Vote/bin/x64/Release/net48/AutoEvent.Vote.dll
